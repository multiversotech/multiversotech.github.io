# Nome do workflow (robô)
name: Build and Deploy to GitHub Pages

# Gatilho: Este workflow vai rodar toda vez que houver um 'push' na branch 'main'
on:
  push:
    branches: [ "main" ]

# Permissões: Dá ao workflow permissão para escrever no repositório (para fazer o deploy)
permissions:
  contents: write
  pages: write
  id-token: write

# Tarefas: O que o robô vai fazer
jobs:
  build-and-deploy:
    # Ambiente: Especifica que esta tarefa vai gerar um artefato para o GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    # Máquina: Vai rodar em uma máquina virtual com a versão mais recente do Ubuntu
    runs-on: ubuntu-latest

    # Passos: A sequência de comandos que o robô vai executar
    steps:
      # 1. Baixa o código do seu repositório para a máquina virtual
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configura o ambiente Node.js (v22)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Instala as dependências do projeto (o fs-extra)
      - name: Install dependencies
        run: npm install

      # 4. Compila o SCSS para gerar o CSS
      - name: Compile SCSS
        run: npm run sass:build

      # 5. Executa script de build para gerar a pasta 'site'
      - name: Build the site
        run: node scripts/build.mjs
      
      # 6. Configura o ambiente para o deploy no GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 7. Faz o upload da pasta 'site' como um artefato
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      # 8. Faz o deploy do artefato para o GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4